<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Solar Energy</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f4f7f6; min-height: 100vh; padding-bottom: 75px; color: #333; }
        
        /* NAVBAR */
        .navbar { background: #111827; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #38ef7d; }
        
        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; text-decoration: none; font-size: 11px; font-weight: 700; gap: 4px; cursor: pointer; transition: 0.3s; }
        .bottom-nav-item.active { color: #111827; transform: translateY(-3px); }
        .bottom-nav-item i { font-size: 22px; font-style: normal; }
        
        /* LAYOUT & CARDS */
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 800; color: #1f2937; margin-bottom: 15px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
        
        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .stat-card { background: linear-gradient(135deg, #1f2937 0%, #374151 100%); color: white; padding: 20px; border-radius: 16px; text-align: center; }
        .stat-card.green { background: linear-gradient(135deg, #065f46 0%, #059669 100%); }
        .stat-card.red { background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); }
        .stat-num { font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        .stat-label { font-size: 11px; text-transform: uppercase; font-weight: 600; opacity: 0.8; }
        
        /* LIST ITEMS (Users, Deposits, etc) */
        .list-item { border: 1px solid #e5e7eb; padding: 15px; border-radius: 12px; margin-bottom: 12px; background: #fafafa; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .badge.pending { background: #fef08a; color: #854d0e; }
        .badge.approved { background: #bbf7d0; color: #166534; }
        .badge.rejected { background: #fecaca; color: #991b1b; }
        .badge.active { background: #bfdbfe; color: #1e3a8a; }
        .badge.blocked { background: #fecaca; color: #991b1b; }
        
        .item-detail { font-size: 13px; color: #4b5563; margin-bottom: 4px; }
        .item-detail strong { color: #111827; }
        
        /* BUTTONS */
        .action-btns { display: flex; gap: 8px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; color: white; transition: 0.2s; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        .btn-primary { background: #3b82f6; }
        .btn-dark { background: #1f2937; }
        .btn-block { width: 100%; }
        
        /* FORMS */
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
        input:focus { outline: none; border-color: #3b82f6; }
        
        /* LOGIN PAGE */
        #login { display: flex; align-items: center; justify-content: center; height: 100vh; background: #111827; margin: -15px; padding: 20px; }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        
        /* SEARCH BAR */
        .search-bar { position: relative; margin-bottom: 15px; }
        
        /* SPINNER */
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; display:none; justify-content:center; align-items:center; flex-direction:column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #111827; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- FULL PAGE LOADER -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 10px; font-weight: bold; color: #111827;">Syncing Database...</p>
    </div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page active">
        <div id="login">
            <div class="login-box">
                <h2 style="color: #111827; margin-bottom: 5px;">Admin Control</h2>
                <p style="color: #6b7280; margin-bottom: 25px; font-size: 14px;">Authorized Personnel Only</p>
                <input type="text" id="adminUser" placeholder="Admin Username">
                <input type="password" id="adminPass" placeholder="Admin Password">
                <button class="btn btn-dark btn-block" onclick="adminLogin()" style="padding: 14px; font-size: 16px;">Secure Login</button>
            </div>
        </div>
    </div>

    <!-- ADMIN LAYOUT -->
    <div id="mainLayout" style="display: none;">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo">⚡ Solar Admin</div>
            <div style="font-size: 12px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px;" onclick="logout()">Logout 🚪</div>
        </nav>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <div class="bottom-nav-item active" id="nav-dash" onclick="showPage('dash')"><i>📊</i><span>Home</span></div>
            <div class="bottom-nav-item" id="nav-users" onclick="showPage('users')"><i>👥</i><span>Users</span></div>
            <div class="bottom-nav-item" id="nav-deps" onclick="showPage('deps')"><i>💳</i><span>Deposits</span></div>
            <div class="bottom-nav-item" id="nav-wids" onclick="showPage('wids')"><i>💸</i><span>Payouts</span></div>
            <div class="bottom-nav-item" id="nav-tix" onclick="showPage('tix')"><i>🎧</i><span>Tickets</span></div>
        </div>

        <div class="container">
            <!-- DASHBOARD -->
            <div id="dash" class="page">
                <h2 style="margin-bottom: 15px; color: #111827;">Overview Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-num" id="s_users">0</div>
                        <div class="stat-label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="s_bal">₹0</div>
                        <div class="stat-label">User Balances</div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-num" id="s_pdep">0</div>
                        <div class="stat-label">Pending Deposits</div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-num" id="s_pwid">0</div>
                        <div class="stat-label">Pending Payouts</div>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" onclick="fetchData()" style="padding: 15px; font-size: 16px;">🔄 Refresh Database</button>
            </div>

            <!-- USERS PAGE -->
            <div id="users" class="page">
                <div class="card">
                    <h2 class="card-title">User Management</h2>
                    <div class="search-bar">
                        <input type="text" id="searchUser" placeholder="🔍 Search by phone or name..." onkeyup="renderUsers()">
                    </div>
                    <div id="userList"></div>
                </div>
            </div>

            <!-- DEPOSITS PAGE -->
            <div id="deps" class="page">
                <div class="card">
                    <h2 class="card-title">Pending Deposits</h2>
                    <div id="depList"></div>
                </div>
            </div>

            <!-- WITHDRAWALS PAGE -->
            <div id="wids" class="page">
                <div class="card">
                    <h2 class="card-title">Pending Withdrawals</h2>
                    <div id="widList"></div>
                </div>
            </div>

            <!-- TICKETS PAGE -->
            <div id="tix" class="page">
                <div class="card">
                    <h2 class="card-title">Support Tickets</h2>
                    <div id="tixList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔥 GITHUB DATABASE CONFIGURATION (SAME AS USER APP) 🔥
        const GITHUB_CONFIG = {
            token: "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN", 
            owner: "YOUR_GITHUB_USERNAME", 
            repo: "YOUR_GITHUB_REPO_NAME", 
            path: "data.json"
        };

        // ADMIN CREDENTIALS (Change this)
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "123456";

        let fullDB = { solarUsers: [], pendingDeposits: [], pendingWithdrawals: [], tickets:[] };

        // ==========================================
        // DATABASE ENGINE
        // ==========================================
        class ServerDB {
            static async get() {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?t=${Date.now()}`, {
                        headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` }, cache: "no-store" 
                    });
                    if (res.status === 404) return { db: fullDB, sha: null };
                    const data = await res.json();
                    return { db: JSON.parse(decodeURIComponent(escape(atob(data.content)))), sha: data.sha };
                } catch (err) { console.error("DB Fetch Error:", err); return null; }
            }

            static async runTransaction(mutationFn) {
                showLoader();
                const data = await this.get();
                if (!data) { hideLoader(); alert("Network Error"); return false; }
                
                let { db, sha } = data;
                if(!db.solarUsers) db.solarUsers =[];
                if(!db.pendingDeposits) db.pendingDeposits = [];
                if(!db.pendingWithdrawals) db.pendingWithdrawals =[];
                if(!db.tickets) db.tickets =[];

                await mutationFn(db);

                try {
                    const content = btoa(unescape(encodeURIComponent(JSON.stringify(db, null, 2))));
                    const body = { message: "Admin Action", content: content };
                    if (sha) body.sha = sha;

                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                        method: 'PUT', headers: { 'Authorization': `token ${GITHUB_CONFIG.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                    });
                    
                    if(res.ok) { await fetchData(); hideLoader(); return true; }
                    else { throw new Error("Save Failed"); }
                } catch(e) { console.error("Save Error:", e); hideLoader(); alert("Failed to save changes!"); return false; }
            }
        }

        // ==========================================
        // CORE LOGIC & NAVIGATION
        // ==========================================
        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function adminLogin() {
            if(document.getElementById('adminUser').value === ADMIN_USER && document.getElementById('adminPass').value === ADMIN_PASS) {
                sessionStorage.setItem('isAdmin', 'true');
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('mainLayout').style.display = 'block';
                fetchData();
            } else {
                alert("❌ Incorrect Credentials!");
            }
        }

        function logout() { sessionStorage.removeItem('isAdmin'); location.reload(); }

        window.onload = () => {
            if(sessionStorage.getItem('isAdmin') === 'true') {
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('mainLayout').style.display = 'block';
                showPage('dash');
                fetchData();
            }
        };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-'+pageId).classList.add('active');
            
            if(pageId === 'users') renderUsers();
            if(pageId === 'deps') renderDeposits();
            if(pageId === 'wids') renderWithdrawals();
            if(pageId === 'tix') renderTickets();
        }

        async function fetchData() {
            showLoader();
            const data = await ServerDB.get();
            if(data && data.db) fullDB = data.db;
            
            // Update Dashboard Stats
            document.getElementById('s_users').textContent = fullDB.solarUsers.length;
            document.getElementById('s_bal').textContent = '₹' + fullDB.solarUsers.reduce((sum, u) => sum + (u.wallet.mainBalance || 0), 0);
            document.getElementById('s_pdep').textContent = fullDB.pendingDeposits.filter(d => d.status === 'pending').length;
            document.getElementById('s_pwid').textContent = fullDB.pendingWithdrawals.filter(w => w.status === 'pending').length;
            
            hideLoader();
            
            // Re-render active view
            const activePage = document.querySelector('.page.active').id;
            if(activePage !== 'dash') showPage(activePage);
        }

        // ==========================================
        // USERS MANAGEMENT
        // ==========================================
        function renderUsers() {
            const query = document.getElementById('searchUser').value.toLowerCase();
            const list = document.getElementById('userList');
            list.innerHTML = '';
            
            const filtered = fullDB.solarUsers.filter(u => u.phone.includes(query) || u.name.toLowerCase().includes(query)).reverse().slice(0, 50); // Show max 50 for performance
            
            if(filtered.length === 0) return list.innerHTML = '<p style="text-align:center;color:#888;">No users found</p>';

            filtered.forEach(u => {
                const statusColor = u.status === 'blocked' ? 'blocked' : 'active';
                list.innerHTML += `
                <div class="list-item">
                    <div class="list-header">
                        <strong>${u.name}</strong>
                        <span class="badge ${statusColor}">${u.status.toUpperCase()}</span>
                    </div>
                    <div class="item-detail"><strong>📱 Phone:</strong> ${u.phone}</div>
                    <div class="item-detail"><strong>💰 Balance:</strong> ₹${u.wallet.mainBalance}</div>
                    <div class="item-detail"><strong>👥 Refers:</strong> ${u.referrals.count} (Code: ${u.referralCode})</div>
                    <div class="action-btns">
                        <button class="btn btn-primary" onclick="editBalance('${u.id}', '${u.name}')">Edit Bal</button>
                        <button class="btn ${u.status === 'blocked' ? 'btn-success' : 'btn-danger'}" onclick="toggleBlock('${u.id}', '${u.status}')">
                            ${u.status === 'blocked' ? 'Unblock' : 'Block'}
                        </button>
                    </div>
                </div>`;
            });
        }

        async function editBalance(userId, name) {
            const amt = prompt(`Enter new balance amount for ${name}:`);
            if(amt === null || amt === '') return;
            const newBal = parseInt(amt);
            if(isNaN(newBal) || newBal < 0) return alert("Invalid amount!");

            await ServerDB.runTransaction(async (db) => {
                let user = db.solarUsers.find(u => u.id === userId);
                if(user) user.wallet.mainBalance = newBal;
            });
        }

        async function toggleBlock(userId, currentStatus) {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            if(!confirm(`Are you sure you want to ${newStatus} this user?`)) return;

            await ServerDB.runTransaction(async (db) => {
                let user = db.solarUsers.find(u => u.id === userId);
                if(user) user.status = newStatus;
            });
        }

        // ==========================================
        // DEPOSITS MANAGEMENT
        // ==========================================
        function renderDeposits() {
            const list = document.getElementById('depList');
            list.innerHTML = '';
            
            // Sort: Pending first, then newest
            const deps =[...fullDB.pendingDeposits].sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (a.status !== 'pending' && b.status === 'pending') return 1;
                return new Date(b.requestedAt) - new Date(a.requestedAt);
            });

            if(deps.length === 0) return list.innerHTML = '<p style="text-align:center;color:#888;">No deposits found</p>';

            deps.forEach(d => {
                const badgeClass = d.status;
                const user = fullDB.solarUsers.find(u => u.id === d.userId) || {name: 'Unknown'};
                
                let btns = '';
                if(d.status === 'pending') {
                    btns = `
                    <div class="action-btns">
                        <button class="btn btn-success" onclick="handleDeposit('${d.id}', 'approved')">Approve</button>
                        <button class="btn btn-danger" onclick="handleDeposit('${d.id}', 'rejected')">Reject</button>
                    </div>`;
                }

                list.innerHTML += `
                <div class="list-item">
                    <div class="list-header">
                        <strong style="font-size:16px;">₹${d.amount}</strong>
                        <span class="badge ${badgeClass}">${d.status.toUpperCase()}</span>
                    </div>
                    <div class="item-detail"><strong>👤 User:</strong> ${user.name} (${d.userPhone})</div>
                    <div class="item-detail"><strong>📝 UTR/Ref:</strong> <span style="color:#3b82f6; font-weight:bold;">${d.transactionId}</span></div>
                    <div class="item-detail"><strong>🕒 Time:</strong> ${new Date(d.requestedAt).toLocaleString()}</div>
                    ${btns}
                </div>`;
            });
        }

        async function handleDeposit(depId, action) {
            if(!confirm(`Are you sure you want to ${action.toUpperCase()} this deposit?`)) return;

            await ServerDB.runTransaction(async (db) => {
                let dep = db.pendingDeposits.find(d => d.id === depId);
                let user = db.solarUsers.find(u => u.id === dep.userId);
                
                if(dep && user && dep.status === 'pending') {
                    dep.status = action;
                    if(action === 'approved') {
                        user.wallet.mainBalance += parseInt(dep.amount); // Add money to user wallet
                    }
                }
            });
        }

        // ==========================================
        // WITHDRAWALS MANAGEMENT
        // ==========================================
        function renderWithdrawals() {
            const list = document.getElementById('widList');
            list.innerHTML = '';
            
            const wids =[...fullDB.pendingWithdrawals].sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (a.status !== 'pending' && b.status === 'pending') return 1;
                return new Date(b.requestedAt) - new Date(a.requestedAt);
            });

            if(wids.length === 0) return list.innerHTML = '<p style="text-align:center;color:#888;">No withdrawals found</p>';

            wids.forEach(w => {
                const user = fullDB.solarUsers.find(u => u.id === w.userId) || {name: 'Unknown', phone: ''};
                
                let btns = '';
                if(w.status === 'pending') {
                    btns = `
                    <div class="action-btns">
                        <button class="btn btn-success" onclick="handleWithdrawal('${w.id}', 'approved')">Paid (Approve)</button>
                        <button class="btn btn-danger" onclick="handleWithdrawal('${w.id}', 'rejected')">Reject (Refund)</button>
                    </div>`;
                }

                list.innerHTML += `
                <div class="list-item">
                    <div class="list-header">
                        <strong style="font-size:16px; color:#ef4444;">-₹${w.amount}</strong>
                        <span class="badge ${w.status}">${w.status.toUpperCase()}</span>
                    </div>
                    <div class="item-detail"><strong>👤 User:</strong> ${user.name} (${user.phone})</div>
                    <div class="item-detail"><strong>🏦 Bank/UPI:</strong> <span style="background:#e0e7ff; padding:2px 5px; border-radius:4px; font-weight:bold;">${w.method}</span></div>
                    <div class="item-detail"><strong>🕒 Time:</strong> ${new Date(w.requestedAt).toLocaleString()}</div>
                    ${btns}
                </div>`;
            });
        }

        async function handleWithdrawal(widId, action) {
            let msg = action === 'approved' ? "Confirm you have PAID the user?" : "Reject and REFUND amount to user wallet?";
            if(!confirm(msg)) return;

            await ServerDB.runTransaction(async (db) => {
                let wid = db.pendingWithdrawals.find(w => w.id === widId);
                let user = db.solarUsers.find(u => u.id === wid.userId);
                
                if(wid && user && wid.status === 'pending') {
                    wid.status = action;
                    if(action === 'rejected') {
                        // Refund the balance back
                        user.wallet.mainBalance += parseInt(wid.amount);
                        user.wallet.totalWithdrawn -= parseInt(wid.amount);
                    }
                }
            });
        }

        // ==========================================
        // TICKET MANAGEMENT
        // ==========================================
        function renderTickets() {
            const list = document.getElementById('tixList');
            list.innerHTML = '';
            
            const tickets =[...fullDB.tickets].sort((a, b) => new Date(b.date) - new Date(a.date));

            if(tickets.length === 0) return list.innerHTML = '<p style="text-align:center;color:#888;">No tickets found</p>';

            tickets.forEach(t => {
                let btns = t.status === 'Open' ? `<button class="btn btn-success btn-block" style="margin-top:10px;" onclick="resolveTicket('${t.id}')">Mark as Resolved</button>` : '';

                list.innerHTML += `
                <div class="list-item">
                    <div class="list-header">
                        <strong>${t.subject}</strong>
                        <span class="badge ${t.status === 'Open' ? 'pending' : 'approved'}">${t.status}</span>
                    </div>
                    <div class="item-detail"><strong>📱 Phone:</strong> ${t.phone}</div>
                    <div class="item-detail" style="background:white; padding:8px; border-radius:6px; border:1px solid #eee; margin-top:8px;">${t.message}</div>
                    ${btns}
                </div>`;
            });
        }

        async function resolveTicket(ticketId) {
            if(!confirm("Mark this ticket as resolved?")) return;

            await ServerDB.runTransaction(async (db) => {
                let ticket = db.tickets.find(t => t.id === ticketId);
                if(ticket) ticket.status = 'Resolved';
            });
        }
    </script>
</body>
</html>
