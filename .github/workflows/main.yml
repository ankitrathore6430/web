name: Ultimate Multi-Tab Bot

on:
  workflow_dispatch:
    inputs:
      bot_on:
        description: 'Bot ON/OFF (true/false)'
        required: true
        default: 'true'
      site_url:
        description: 'URL to visit (Direct or Shortlink)'
        required: true
        default: 'https://example.com'
      tabs:
        description: 'Number of tabs to open'
        required: true
        default: '5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Bot
        env:
          BOT_ENABLED: ${{ github.event.inputs.bot_on }}
          TARGET_URL: ${{ github.event.inputs.site_url }}
          TAB_COUNT: ${{ github.event.inputs.tabs }}
        run: node bot.js

      - name: Upload Tab Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-tabs-screenshots
          path: screenshots/*.png
