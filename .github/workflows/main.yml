name: Ultimate Ad-Impression Bot

on:
  workflow_dispatch:
    inputs:
      bot_on:
        description: 'Bot Chalu Karein? (true/false)'
        required: true
        default: 'true'
      site_url:
        description: 'Website ya Ad Link daalein'
        required: true
        default: 'https://example.com'
      tabs:
        description: 'Kitne tabs chalane hain? (Max 10 recommended)'
        required: true
        default: '5'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stealth Packages
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Start Automation
        env:
          BOT_ENABLED: ${{ github.event.inputs.bot_on }}
          TARGET_URL: ${{ github.event.inputs.site_url }}
          TAB_COUNT: ${{ github.event.inputs.tabs }}
        run: node bot.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-bot-views
          path: screenshots/*.png
